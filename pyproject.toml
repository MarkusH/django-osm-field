[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=77",
]

[project]
name = "django-osm-field"
version = "0.6.0"
description = "Django OpenStreetMap Field"
readme = "README.rst"
keywords = [
  "Django",
  "Geo",
  "Geoposition",
  "OpenStreetMap",
  "OSM",
]
license = "MIT"
license-files = [ "LICENSE" ]
authors = [
  { name = "Markus Holtermann", email = "info@markusholtermann.eu" },
  { name = "Thomas Schmidt", email = "schmidt@netaction.de" },
]
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: IPython",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed",
]
dependencies = [
  "django>=4.2",
]
urls = { Changelog = "https://github.com/MarkusH/django-osm-field/blob/main/CHANGELOG.md", Funding = "https://github.com/sponsors/MarkusH/", Repository = "https://github.com/MarkusH/django-osm-field" }

[dependency-groups]
test = [
  "coverage[toml]",
  "psycopg[binary]",
  "pytest",
  "pytest-django",
  "pytest-randomly",
]
docs = [
  "django",
  "sphinx",
  "sphinx-rtd-theme",
]
django42 = [ "django>=4.2a1,<5; python_version>='3.8'" ]
django50 = [ "django>=5a1,<5.1; python_version>='3.10'" ]
django51 = [ "django>=5.1a1,<5.2; python_version>='3.10'" ]
django52 = [ "django>=5.2a1,<6; python_version>='3.10'" ]
django60 = [ "django>=6a1,<6.1; python_version>='3.12'" ]

[tool.uv]
conflicts = [
  [
    { group = "django42" },
    { group = "django50" },
    { group = "django51" },
    { group = "django52" },
    { group = "django60" },
  ],
]

[tool.ruff]
lint.select = [
  # flake8-bugbear
  "B",
  # flake8-comprehensions
  "C4",
  # pycodestyle
  "E",
  # Pyflakes errors
  "F",
  # isort
  "I",
  # flake8-simplify
  "SIM",
  # flake8-tidy-imports
  "TID",
  # pyupgrade
  "UP",
  # Pyflakes warnings
  "W",
]
lint.ignore = [
  # flake8-bugbear opinionated rules
  "B9",
  # line-too-long
  "E501",
  # suppressible-exception
  "SIM105",
  # if-else-block-instead-of-if-exp
  "SIM108",
]
lint.extend-safe-fixes = [
  # non-pep585-annotation
  "UP006",
]
lint.isort.required-imports = [ "from __future__ import annotations" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.mypy]
mypy_path = "src/"
namespace_packages = false
warn_unreachable = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
]
strict = true
overrides = [ { module = "tests.*", allow_untyped_defs = true } ]

[tool.pytest]
ini_options.addopts = """\
    --strict-config
    --strict-markers
    --ds=tests.settings
    """
ini_options.xfail_strict = true
ini_options.django_find_project = false

[tool.coverage]
run.source = [
  "osm_field",
  "tests",
]
run.branch = true
run.parallel = true
paths.source = [
  "src",
  ".tox/**/site-packages",
]
report.show_missing = true

[tool.rstcheck]
report_level = "ERROR"
ignore_directives = [
  "automodule", # Not loaded by rstcheck
]
